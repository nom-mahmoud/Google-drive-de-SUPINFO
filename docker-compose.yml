version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: supfile_db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-supfile_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - supfile-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - supfile_network

  api:
    build:
      context: ./docker/php
    container_name: supfile_api
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./storage_volume:/var/www/html/storage/app/local_storage
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-supfile_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    networks:
      - supfile_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: supfile_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - supfile_network
    depends_on:
      - api

  web:
    image: node:20-alpine
    container_name: supfile_web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - supfile_network

networks:
  supfile_network:
    driver: bridge

volumes:
  supfile-pgdata:
    driver: local
